              +   '<span class="pick-pill" style="background:#059669; color:#fff;">#11:W ✅</span>'
              + '</div>'
              + '<div style="font-size:0.86rem; color:#fde047; font-weight:900;">1 Wrong Leg Still Wins 100% · Patent Pending No. 10-2026-0205596</div>'
              + '</div>';
          }
        },
        {
          duration: 5500,
          gold: true,
          en: "Start your 7-DAY FREE VVIP TRIAL now at TOKEON.APP! Never lose a parlay to a 1-leg bad beat again!",
          kr: "지금 TOKEON.APP에서 【1주일(7일) 무료 VVIP 프리패스】로 시작하세요! 다시는 한 경기 때문에 팔레이를 날리지 마십시오!",
          html: function() {
            return '<div class="patent-shield-hero">'
              + '<div style="font-size:0.9rem; font-weight:900; color:#fde047; letter-spacing:1.2px; margin-bottom:6px;">🛡️ PATENT PENDING : NO. 10-2026-0205596</div>'
              + '<h1 style="font-size:1.85rem; font-weight:900; color:#ffffff; margin-bottom:10px;">🎁 START YOUR 7-DAY FREE VVIP TRIAL!</h1>'
              + '<div style="display:inline-block; background:linear-gradient(135deg, #059669, #10b981); border:2px solid #fde047; border-radius:12px; padding:12px 26px; font-size:1.35rem; font-weight:900; color:#fff; box-shadow:0 0 25px rgba(16,185,129,0.7); margin-bottom:10px;">https://tokeon.app</div>'
              + '<div style="font-size:0.88rem; color:#fde047; font-weight:900;">✓ 7 Days Unlimited Access Free · ✓ Live 2026-27 NBA &amp; NFL Auto-Sync</div>'
              + '</div>';
          }
        }
      ]
    };

    function speakEn(text) {
      try {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 1.04;
        u.pitch = 0.98;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function renderStep() {
      var list = EPISODES[currentEp];
      if (!list || !list[stepIdx]) stepIdx = 0;
      var item = list[stepIdx];

      var container = document.getElementById('scene3dContainer');
      container.innerHTML = '<div class="card-3d ' + (item.gold ? 'gold-focus' : '') + '">' + item.html() + '</div>';

      document.getElementById('subTextEn').textContent = item.en;
      var krEl = document.getElementById('subTextKr');
      krEl.textContent = item.kr;
      krEl.style.display = showKrSub ? 'block' : 'none';

      speakEn(item.en);

      if (sceneTimer) clearTimeout(sceneTimer);
      sceneTimer = setTimeout(function() {
        stepIdx = (stepIdx + 1) % list.length;
        renderStep();
      }, item.duration);
    }

    function selectEpisode(ep) {
      currentEp = ep;
      stepIdx = 0;
      document.getElementById('btnEp1').className = 'studio-btn' + (ep === 1 ? ' active' : '');
      document.getElementById('btnEp2').className = 'studio-btn' + (ep === 2 ? ' active' : '');
      renderStep();
    }

    function restartCurrentEpisode() {
      stepIdx = 0;
      renderStep();
    }

    function toggleAspect() {
      var w = document.getElementById('stageWrapper');
      w.classList.toggle('vertical-mode');
    }

    function toggleKrSub() {
      showKrSub = !showKrSub;
      document.getElementById('krSubLabel').textContent = 'KR Sub: ' + (showKrSub ? 'ON' : 'OFF');
      document.getElementById('subTextKr').style.display = showKrSub ? 'block' : 'none';
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderStep();
    });
  </script>
</body>
</html>
